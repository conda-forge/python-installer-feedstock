{% set name = "python-installer" %}
{% set pypi_name = "installer" %}
{% set version = "1.1.0" %}


package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ pypi_name[0] }}/{{ pypi_name }}/{{ pypi_name }}-{{ version }}.tar.gz
  sha256: 5adc0c01ce62d809989e246987cd68944fe5df8af562d0358f65b2ab15cb5de7

build:
  number: 0
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - pip
    - python {{ python_min }}
    - flit-core >=3.2.0,<4
  run:
    - python >={{ python_min }}

test:
  requires:
    - python {{ python_min }}
  imports:
    - installer

about:
  home: https://github.com/pradyunsg/installer
  summary: A library for installing Python wheels.
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - xhochy
