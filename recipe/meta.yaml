{% set name = "python-installer" %}
{% set pypi_name = "installer" %}
{% set version = "1.0.0" %}


package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ pypi_name[0] }}/{{ pypi_name }}/{{ pypi_name }}-{{ version }}.tar.gz
  sha256: c6d691331621cf3fec4822f5c6f83cab3705f79b316225dc454127411677c71f

build:
  number: 0
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - pip
    - python {{ python_min }}
    - flit-core >=3.2.0,<4
  run:
    - python >={{ python_min }}

test:
  requires:
    - python {{ python_min }}
  imports:
    - installer

about:
  home: https://github.com/pradyunsg/installer
  summary: A library for installing Python wheels.
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - xhochy
